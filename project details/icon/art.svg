<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bef74"/>
      <stop offset="0.55" stop-color="#63cf52"/>
      <stop offset="1" stop-color="#49b53d"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74db60"/>
      <stop offset="1" stop-color="#3fa534"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb6d4"/>
      <stop offset="1" stop-color="#ff7fb4"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#b6ffe0"/>
      <stop offset="0.45" stop-color="#46c99a"/>
      <stop offset="1" stop-color="#166a4f"/>
    </radialGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fb0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff8fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== soft glow behind head ===== -->
  <circle cx="256" cy="240" r="212" fill="url(#glow)"/>

  <!-- ===== back hair ===== -->
  <ellipse cx="256" cy="238" rx="176" ry="186" fill="#3fa534"/>

  <!-- ===== twin tails ===== -->
  <ellipse cx="96" cy="300" rx="56" ry="150" fill="url(#tail)" transform="rotate(12 96 300)"/>
  <ellipse cx="416" cy="300" rx="56" ry="150" fill="url(#tail)" transform="rotate(-12 416 300)"/>
  <circle cx="96" cy="170" r="30" fill="#ff8fc0"/>
  <circle cx="416" cy="170" r="30" fill="#ff8fc0"/>
  <path d="M96 140 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#ffe36e"/>
  <path d="M416 140 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#ffe36e"/>

  <!-- ===== small torso (chibi) ===== -->
  <path d="M186 512 Q186 404 256 404 Q326 404 326 512 Z" fill="url(#shirt)"/>
  <path d="M236 406 L256 432 L276 406 Z" fill="#ffffff"/>

  <!-- ===== download sign (held in front) ===== -->
  <rect x="176" y="416" width="160" height="92" rx="18" fill="#ffffff"/>
  <rect x="249" y="434" width="14" height="28" rx="5" fill="#2fae7a"/>
  <path d="M236 456 L276 456 L256 480 Z" fill="#2fae7a"/>
  <path d="M230 486 L230 500 L282 500 L282 486" fill="none" stroke="#2fae7a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== arms + hands ===== -->
  <path d="M190 430 L212 468" fill="none" stroke="#ffe2d2" stroke-width="30" stroke-linecap="round"/>
  <path d="M322 430 L300 468" fill="none" stroke="#ffe2d2" stroke-width="30" stroke-linecap="round"/>
  <circle cx="212" cy="470" r="17" fill="#ffe2d2"/>
  <circle cx="300" cy="470" r="17" fill="#ffe2d2"/>

  <!-- ===== neck ===== -->
  <ellipse cx="256" cy="392" rx="34" ry="30" fill="#f0c3ad"/>

  <!-- ===== hair cap (behind face) + face ===== -->
  <ellipse cx="256" cy="196" rx="172" ry="166" fill="url(#hair)"/>
  <ellipse cx="256" cy="258" rx="144" ry="136" fill="#ffe6d7"/>

  <!-- ===== bangs over forehead ===== -->
  <path d="M104 160 Q256 96 408 160 L408 176 Q388 236 344 208 Q332 250 296 214 Q272 258 244 214 Q210 254 190 210 Q150 244 128 190 Z" fill="#6fd35c"/>
  <path d="M150 176 Q186 240 224 176 Z" fill="#5cc44e" opacity="0.5"/>
  <path d="M300 176 Q338 240 374 176 Z" fill="#5cc44e" opacity="0.5"/>
  <!-- ahoge (cowlick) -->
  <path d="M256 42 q22 -34 48 -26 q-22 12 -34 40" fill="none" stroke="#7fe06a" stroke-width="13" stroke-linecap="round"/>

  <!-- ===== hair flower accessory ===== -->
  <g transform="translate(360 132)">
    <g fill="#ff9ec4">
      <ellipse cx="0" cy="-20" rx="12" ry="16"/>
      <ellipse cx="19" cy="-6" rx="12" ry="16" transform="rotate(72)"/>
      <ellipse cx="12" cy="16" rx="12" ry="16" transform="rotate(144)"/>
      <ellipse cx="-12" cy="16" rx="12" ry="16" transform="rotate(216)"/>
      <ellipse cx="-19" cy="-6" rx="12" ry="16" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#ffe36e"/>
  </g>

  <!-- ===== eyebrows ===== -->
  <path d="M168 232 Q200 214 234 228" fill="none" stroke="#6a8f52" stroke-width="7" stroke-linecap="round"/>
  <path d="M278 228 Q312 214 344 232" fill="none" stroke="#6a8f52" stroke-width="7" stroke-linecap="round"/>

  <!-- ===== big shiny eyes ===== -->
  <!-- whites -->
  <ellipse cx="200" cy="292" rx="42" ry="48" fill="#ffffff"/>
  <ellipse cx="312" cy="292" rx="42" ry="48" fill="#ffffff"/>
  <!-- iris -->
  <ellipse cx="202" cy="298" rx="32" ry="38" fill="url(#iris)"/>
  <ellipse cx="310" cy="298" rx="32" ry="38" fill="url(#iris)"/>
  <!-- pupils -->
  <ellipse cx="204" cy="302" rx="15" ry="20" fill="#123528"/>
  <ellipse cx="308" cy="302" rx="15" ry="20" fill="#123528"/>
  <!-- big highlight (upper-left) -->
  <circle cx="188" cy="282" r="12" fill="#ffffff"/>
  <circle cx="296" cy="282" r="12" fill="#ffffff"/>
  <!-- small highlight (lower-right) -->
  <circle cx="218" cy="314" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="326" cy="314" r="6" fill="#ffffff" opacity="0.9"/>
  <!-- glint bottom -->
  <circle cx="204" cy="322" r="4" fill="#ffffff" opacity="0.75"/>
  <circle cx="308" cy="322" r="4" fill="#ffffff" opacity="0.75"/>
  <!-- upper lashes -->
  <path d="M156 274 Q200 246 244 274" fill="none" stroke="#3a2a2a" stroke-width="10" stroke-linecap="round"/>
  <path d="M268 274 Q312 246 356 274" fill="none" stroke="#3a2a2a" stroke-width="10" stroke-linecap="round"/>
  <!-- lash flicks -->
  <path d="M152 272 q-8 -12 -6 -22" fill="none" stroke="#3a2a2a" stroke-width="7" stroke-linecap="round"/>
  <path d="M360 272 q8 -12 6 -22" fill="none" stroke="#3a2a2a" stroke-width="7" stroke-linecap="round"/>

  <!-- ===== blush ===== -->
  <ellipse cx="158" cy="340" rx="28" ry="15" fill="url(#cheek)"/>
  <ellipse cx="354" cy="340" rx="28" ry="15" fill="url(#cheek)"/>

  <!-- ===== cute open smile + tongue ===== -->
  <path d="M236 344 Q256 372 276 344 Q256 356 236 344 Z" fill="#c9626f"/>
  <path d="M244 348 Q256 360 268 348 Z" fill="#ff9fb3"/>
  <!-- tiny nose -->
  <ellipse cx="256" cy="330" rx="4" ry="3" fill="#e7a58e"/>

  <!-- ===== sparkles ===== -->
  <path d="M430 118 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 z" fill="#ffe36e"/>
  <path d="M82 150 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#ffe36e"/>
  <path d="M452 300 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#ffd1e6"/>
</svg>
