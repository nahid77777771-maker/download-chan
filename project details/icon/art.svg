<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82df6c"/>
      <stop offset="1" stop-color="#53bd46"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa8cb"/>
      <stop offset="1" stop-color="#ff7fb4"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fb0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8fb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== back hair ===== -->
  <ellipse cx="256" cy="248" rx="162" ry="178" fill="#46ac3a"/>
  <!-- side locks -->
  <ellipse cx="132" cy="312" rx="42" ry="104" fill="#53bd46"/>
  <ellipse cx="380" cy="312" rx="42" ry="104" fill="#53bd46"/>

  <!-- ===== torso ===== -->
  <path d="M150 512 Q150 372 256 372 Q362 372 362 512 Z" fill="url(#shirt)"/>
  <!-- collar -->
  <path d="M226 374 L256 406 L286 374 Z" fill="#ffffff"/>
  <!-- sleeves -->
  <ellipse cx="164" cy="414" rx="40" ry="34" fill="#ff86b6"/>
  <ellipse cx="348" cy="414" rx="40" ry="34" fill="#ff86b6"/>

  <!-- ===== download sign (held in front) ===== -->
  <rect x="164" y="398" width="184" height="104" rx="20" fill="#ffffff"/>
  <rect x="164" y="398" width="184" height="104" rx="20" fill="none" stroke="#eadcff" stroke-width="0"/>
  <!-- arrow shaft -->
  <rect x="249" y="418" width="14" height="30" rx="4" fill="#2fae7a"/>
  <!-- arrow head -->
  <path d="M234 444 L278 444 L256 470 Z" fill="#2fae7a"/>
  <!-- tray -->
  <path d="M226 472 L226 488 L286 488 L286 472" fill="none" stroke="#2fae7a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== arms + hands (in front of sign) ===== -->
  <path d="M172 414 L196 456" fill="none" stroke="#ffe2d2" stroke-width="30" stroke-linecap="round"/>
  <path d="M340 414 L316 456" fill="none" stroke="#ffe2d2" stroke-width="30" stroke-linecap="round"/>
  <circle cx="196" cy="458" r="17" fill="#ffe2d2"/>
  <circle cx="316" cy="458" r="17" fill="#ffe2d2"/>

  <!-- ===== neck ===== -->
  <ellipse cx="256" cy="366" rx="34" ry="30" fill="#f0c3ad"/>

  <!-- ===== hair cap (behind face) + face ===== -->
  <ellipse cx="256" cy="196" rx="152" ry="144" fill="url(#hair)"/>
  <ellipse cx="256" cy="252" rx="120" ry="126" fill="#ffe2d2"/>
  <!-- bangs over forehead -->
  <path d="M136 128 L376 128 L376 156 Q256 250 136 156 Z" fill="#6fd35c"/>
  <!-- bang tips -->
  <path d="M150 140 Q180 210 214 150 Z" fill="#5cc44e" opacity="0.55"/>
  <path d="M298 150 Q332 210 362 140 Z" fill="#5cc44e" opacity="0.55"/>
  <!-- ahoge (cowlick) -->
  <path d="M256 60 q18 -36 44 -30 q-20 14 -30 40" fill="none" stroke="#6fd35c" stroke-width="13" stroke-linecap="round"/>

  <!-- ===== eyes ===== -->
  <ellipse cx="208" cy="272" rx="28" ry="32" fill="#ffffff"/>
  <ellipse cx="304" cy="272" rx="28" ry="32" fill="#ffffff"/>
  <ellipse cx="210" cy="276" rx="19" ry="24" fill="#2f9e6e"/>
  <ellipse cx="302" cy="276" rx="19" ry="24" fill="#2f9e6e"/>
  <ellipse cx="210" cy="278" rx="9" ry="12" fill="#173a30"/>
  <ellipse cx="302" cy="278" rx="9" ry="12" fill="#173a30"/>
  <circle cx="202" cy="266" r="7" fill="#ffffff"/>
  <circle cx="294" cy="266" r="7" fill="#ffffff"/>
  <!-- upper lashes -->
  <path d="M180 256 Q208 238 236 256" fill="none" stroke="#3a2a2a" stroke-width="7" stroke-linecap="round"/>
  <path d="M276 256 Q304 238 332 256" fill="none" stroke="#3a2a2a" stroke-width="7" stroke-linecap="round"/>

  <!-- ===== blush ===== -->
  <ellipse cx="176" cy="312" rx="24" ry="13" fill="url(#cheek)"/>
  <ellipse cx="336" cy="312" rx="24" ry="13" fill="url(#cheek)"/>

  <!-- ===== mouth ===== -->
  <path d="M245 322 Q256 332 267 322" fill="none" stroke="#c07a6a" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== sparkles ===== -->
  <path d="M420 150 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 z" fill="#ffe36e"/>
  <path d="M96 196 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#ffe36e"/>
</svg>
